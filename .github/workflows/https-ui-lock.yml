name: HTTPS SO-UI lock

on:
  push:
    branches: [fix-ui-lock-https]
    paths:
      - ".github/workflows/https-ui-lock.yml"

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ui-lock-https
      - name: Use git+https for @promexma/ui
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path("frontend/package-lock.json")
          s = p.read_text()
          s = s.replace(
              "git+ssh://git@github.com/Procesos-y-Controles-PMX/SO-UI.git",
              "git+https://github.com/Procesos-y-Controles-PMX/SO-UI.git",
          )
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git diff --cached --quiet || git commit -m "Fetch @promexma/ui over HTTPS so Vercel can install it."
          git push
